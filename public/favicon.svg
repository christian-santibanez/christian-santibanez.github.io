<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a004a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#11001F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo con borde redondeado -->
  <rect width="100" height="100" rx="18" ry="18" fill="url(#bg)" />

  <!-- Borde sutil -->
  <rect width="100" height="100" rx="18" ry="18" fill="none" stroke="#fcf4ff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Iniciales CS -->
  <text
    x="50"
    y="66"
    font-family="Outfit, sans-serif"
    font-size="46"
    font-weight="700"
    text-anchor="middle"
    fill="#fcf4ff"
    letter-spacing="-2"
  >CS</text>
</svg>
